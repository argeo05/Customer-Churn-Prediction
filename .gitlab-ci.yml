stages:
  - test
  - build

backend_test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - pytest

frontend_test:
  stage: test
  image: node:22
  before_script:
    - npm  ci
  script:
    - npm test

dcoker_build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t backend ./backend
    - docker build -t frontend ./frontend